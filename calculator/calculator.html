<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Casio fx-115ES PLUS Emulator</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(180deg, #d8e2e7 0%, #c2cfd6 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 8px 40px;
}

.window {
  width: 360px;
  background: #ebebeb;
  border: 1px solid #888;
  border-radius: 4px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  overflow: hidden;
}

.title-bar {
  height: 28px;
  background: linear-gradient(180deg, #f5f5f5, #d9d9d9);
  display: flex;
  align-items: center;
  padding: 0 6px;
  font-size: 12px;
  border-bottom: 1px solid #bbb;
}
.title-bar .icon {
  width: 14px; height: 14px;
  background: #444;
  border-radius: 2px;
  margin-right: 6px;
  display: inline-block;
}
.title-bar .title { flex: 1; color: #222; }
.window-controls { display: flex; gap: 2px; }
.wbtn {
  width: 28px; height: 22px;
  border: none; background: transparent;
  font-size: 11px; cursor: pointer;
}
.wbtn:hover { background: #d0d0d0; }
.wbtn.close:hover { background: #e81123; color: white; }

.toolbar {
  height: 30px;
  background: #ebebeb;
  border-bottom: 1px solid #ccc;
  display: flex;
  gap: 4px;
  align-items: center;
  padding: 2px 6px;
}
.tbtn {
  width: 26px; height: 24px;
  border: 1px solid transparent;
  background: transparent;
  cursor: pointer;
  border-radius: 3px;
  font-size: 13px;
}
.tbtn:hover { border-color: #aaa; background: #f8f8f8; }

.calc-frame {
  background: #b8c2c8;
  padding: 14px;
}

.calc {
  background: linear-gradient(180deg, #f1f1ef 0%, #e3e2df 100%);
  border-radius: 16px;
  padding: 14px 12px 18px;
  box-shadow: inset 0 2px 4px rgba(255,255,255,0.6),
              0 4px 10px rgba(0,0,0,0.15);
  position: relative;
}

.brand {
  text-align: center;
  font-weight: 800;
  letter-spacing: 2px;
  font-size: 14px;
  color: #2b2b2b;
  margin-bottom: 2px;
}
.model {
  text-align: center;
  font-size: 10px;
  color: #444;
  margin-bottom: 8px;
  letter-spacing: 1px;
}
.model .plus { color: #b00; font-weight: 700; }

.screen {
  background: #c5d2c5;
  border: 2px solid #9a9a9a;
  border-radius: 4px;
  padding: 6px 8px;
  font-family: "Courier New", monospace;
  color: #1a1a1a;
  height: 92px;
  display: flex;
  flex-direction: column;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.25);
}
.screen-status {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1px;
  color: #1a1a1a;
  height: 14px;
}
.screen-lines {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  margin-top: 2px;
  overflow: hidden;
}
.expr-line {
  font-size: 14px;
  text-align: left;
  white-space: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
  min-height: 18px;
}
.expr-line::-webkit-scrollbar { display: none; }
.result-line {
  font-size: 22px;
  text-align: right;
  font-weight: 700;
  white-space: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
  min-height: 26px;
}
.result-line::-webkit-scrollbar { display: none; }

.row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
  margin-top: 6px;
}
.row:has(.dpad) {
  grid-template-columns: 1fr 1fr 1.4fr 1fr 1fr;
  align-items: center;
}
.row:nth-of-type(8), /* numpad rows have 5 cols already */
.row:nth-of-type(9),
.row:nth-of-type(10),
.row:nth-of-type(11) { grid-template-columns: repeat(5, 1fr); }

/* M+ row has 6 keys */
.row:nth-of-type(7) { grid-template-columns: repeat(6, 1fr); }

.key {
  position: relative;
  background: linear-gradient(180deg, #4a4a4a 0%, #2b2b2b 100%);
  color: #f1f1f1;
  border: 1px solid #1a1a1a;
  border-radius: 8px;
  padding: 10px 0 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  box-shadow: 0 2px 0 #111, inset 0 1px 0 rgba(255,255,255,0.15);
  user-select: none;
  transition: transform 0.05s ease, box-shadow 0.05s ease;
  min-height: 30px;
}
.key:active {
  transform: translateY(2px);
  box-shadow: 0 0 0 #111, inset 0 1px 2px rgba(0,0,0,0.4);
}
.key sub, .key sup { font-size: 9px; }

.key.small {
  background: linear-gradient(180deg, #f0f0f0, #d0d0d0);
  color: #222;
  border: 1px solid #888;
  font-size: 10px;
  padding: 6px 0;
  min-height: 22px;
  border-radius: 14px;
}
.key.shift-key { color: #b58900; }
.key.alpha-key { color: #b00; }
.key.mode-key,
.key.on-key { color: #222; }

.key.num {
  background: linear-gradient(180deg, #d9d9d9, #b5b5b5);
  color: #111;
  border: 1px solid #5a5a5a;
  font-size: 16px;
  box-shadow: 0 2px 0 #555, inset 0 1px 0 rgba(255,255,255,0.4);
}
.key.num:active { box-shadow: 0 0 0 #555, inset 0 1px 2px rgba(0,0,0,0.25); }

.key.warn {
  background: linear-gradient(180deg, #6dbf5a, #3e8a2e);
  color: white;
  border: 1px solid #1a4a10;
  box-shadow: 0 2px 0 #1f4d12, inset 0 1px 0 rgba(255,255,255,0.3);
}
.key.warn:active { box-shadow: 0 0 0 #1f4d12, inset 0 1px 2px rgba(0,0,0,0.3); }

.key.equals {
  background: linear-gradient(180deg, #4a4a4a 0%, #1c1c1c 100%);
}

/* Shift label (yellow) above the key */
.key[data-shift]:not([data-shift=""])::before {
  content: attr(data-shift);
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 8px;
  color: #b58900;
  white-space: nowrap;
  font-weight: 700;
}

.key.shift-active {
  outline: 2px solid #ffcd44;
  outline-offset: 1px;
}

/* D-pad */
.dpad {
  position: relative;
  width: 78px;
  height: 78px;
  margin: 0 auto;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #e8e8e8, #b8b8b8);
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
}
.dbtn {
  position: absolute;
  width: 24px; height: 24px;
  background: transparent;
  border: none;
  cursor: pointer;
  font-size: 10px;
  color: #333;
}
.dbtn.up { top: 2px; left: 50%; transform: translateX(-50%); }
.dbtn.down { bottom: 2px; left: 50%; transform: translateX(-50%); }
.dbtn.left { top: 50%; left: 2px; transform: translateY(-50%); }
.dbtn.right { top: 50%; right: 2px; transform: translateY(-50%); }
.dbtn.center {
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 30px; height: 30px;
  border-radius: 50%;
  background: linear-gradient(180deg, #d0d0d0, #a0a0a0);
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  padding: 0 6px;
}
.badge {
  font-size: 8px;
  background: #2b2b2b;
  color: #ddd;
  padding: 3px 6px;
  border-radius: 2px;
  letter-spacing: 0.5px;
}
.tag { font-size: 8px; color: #555; letter-spacing: 1px; }

.hint {
  margin-top: 18px;
  font-size: 12px;
  color: #555;
  text-align: center;
  max-width: 360px;
}
.hint kbd {
  background: #fff;
  border: 1px solid #bbb;
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 1px 5px;
  font-family: monospace;
  font-size: 11px;
  color: #222;
}

/* Error flash */
.result-line.error { color: #b00020; }

</style>
</head>
<body>

  <div class="window">
    <div class="title-bar">
      <span class="icon"></span>
      <span class="title">fx-115ES PLUS Emulator</span>
      <div class="window-controls">
        <button class="wbtn" aria-label="minimize">&#x2014;</button>
        <button class="wbtn" aria-label="maximize">&#x25A1;</button>
        <button class="wbtn close" aria-label="close">&#x2715;</button>
      </div>
    </div>
    <div class="toolbar">
      <button class="tbtn" title="Open">&#x1F4C2;</button>
      <button class="tbtn" title="Window">&#x1F5D6;</button>
      <button class="tbtn" title="Float">&#x21AA;</button>
      <button class="tbtn" title="Capture">&#x1F4F7;</button>
      <button class="tbtn" title="Grid">&#x25A6;</button>
    </div>

    <div class="calc-frame">
      <div class="calc">
        <div class="brand">CASIO</div>
        <div class="model">fx-115ES <span class="plus">PLUS</span></div>

        <div class="screen">
          <div class="screen-status">
            <span id="statShift">D</span>
            <span id="statMode">Math</span>
          </div>
          <div class="screen-lines">
            <div id="exprLine" class="expr-line"></div>
            <div id="resultLine" class="result-line"></div>
          </div>
        </div>

        <!-- Modifier row -->
        <div class="row mod-row">
          <button class="key small shift-key" data-key="SHIFT">SHIFT</button>
          <button class="key small alpha-key" data-key="ALPHA">ALPHA</button>
          <div class="dpad">
            <button class="dbtn up" data-key="UP">&#9650;</button>
            <button class="dbtn left" data-key="LEFT">&#9664;</button>
            <button class="dbtn center"></button>
            <button class="dbtn right" data-key="RIGHT">&#9654;</button>
            <button class="dbtn down" data-key="DOWN">&#9660;</button>
          </div>
          <button class="key small mode-key" data-key="MODE">MODE</button>
          <button class="key small on-key" data-key="ON">ON</button>
        </div>

        <!-- Function rows -->
        <div class="row">
          <button class="key" data-shift="SOLVE" data-key="CALC">CALC</button>
          <button class="key" data-shift="∫dx" data-key="FRAC">a<sup>b</sup>/<sub>c</sub></button>
          <button class="key" data-shift="" data-key="EMPTY1"></button>
          <button class="key" data-shift="" data-key="INV">x<sup>-1</sup></button>
          <button class="key" data-shift="" data-key="LOGAB">log□</button>
        </div>

        <div class="row">
          <button class="key" data-shift="%" data-key="SQRT">&radic;□</button>
          <button class="key" data-shift="3√" data-key="SQUARE">x<sup>2</sup></button>
          <button class="key" data-shift="x√" data-key="POW">x<sup>■</sup></button>
          <button class="key" data-shift="10^" data-key="LOG">log</button>
          <button class="key" data-shift="e^" data-key="LN">ln</button>
        </div>

        <div class="row">
          <button class="key" data-shift="o,'" data-key="NEG">(-)</button>
          <button class="key" data-shift="hyp" data-key="HYP">hyp</button>
          <button class="key" data-shift="sin⁻¹" data-key="SIN">sin</button>
          <button class="key" data-shift="cos⁻¹" data-key="COS">cos</button>
          <button class="key" data-shift="tan⁻¹" data-key="TAN">tan</button>
        </div>

        <div class="row">
          <button class="key" data-shift="STO" data-key="RCL">RCL</button>
          <button class="key" data-shift="←" data-key="ENG">ENG</button>
          <button class="key" data-shift="" data-key="LPAREN">(</button>
          <button class="key" data-shift="" data-key="RPAREN">)</button>
          <button class="key" data-shift="←→" data-key="SD">S↔D</button>
          <button class="key" data-shift="M-" data-key="MPLUS">M+</button>
        </div>

        <!-- Numpad / right block -->
        <div class="row">
          <button class="key num" data-shift="CONST" data-key="7">7</button>
          <button class="key num" data-shift="CONV" data-key="8">8</button>
          <button class="key num" data-shift="CLR" data-key="9">9</button>
          <button class="key warn" data-shift="INS" data-key="DEL">DEL</button>
          <button class="key warn" data-shift="OFF" data-key="AC">AC</button>
        </div>

        <div class="row">
          <button class="key num" data-shift="MATRIX" data-key="4">4</button>
          <button class="key num" data-shift="VECTOR" data-key="5">5</button>
          <button class="key num" data-shift="VERIFY" data-key="6">6</button>
          <button class="key" data-shift="nPr" data-key="MUL">&times;</button>
          <button class="key" data-shift="nCr" data-key="DIV">&divide;</button>
        </div>

        <div class="row">
          <button class="key num" data-shift="STAT" data-key="1">1</button>
          <button class="key num" data-shift="CMPLX" data-key="2">2</button>
          <button class="key num" data-shift="BASE" data-key="3">3</button>
          <button class="key" data-shift="Pol" data-key="PLUS">+</button>
          <button class="key" data-shift="Rec" data-key="MINUS">&minus;</button>
        </div>

        <div class="row">
          <button class="key num" data-shift="Rnd" data-key="0">0</button>
          <button class="key num" data-shift="Ran#" data-key="DOT">.</button>
          <button class="key" data-shift="π" data-key="EXP">&times;10<sup>x</sup></button>
          <button class="key" data-shift="DRG" data-key="ANS">Ans</button>
          <button class="key equals" data-shift="" data-key="EQ">=</button>
        </div>

        <div class="footer">
          <div class="badge">NATURAL-V.P.A.M.</div>
          <div class="tag">TWO WAY POWER</div>
        </div>
      </div>
    </div>
  </div>

  <p class="hint">
    Tip: Use the keyboard. <kbd>0-9</kbd>, <kbd>+ - * /</kbd>, <kbd>(</kbd> <kbd>)</kbd>, <kbd>Enter</kbd>=, <kbd>Backspace</kbd>=DEL, <kbd>Esc</kbd>=AC, <kbd>s</kbd>=SHIFT.
  </p>

  
<script>
(() => {
  'use strict';

  const exprEl = document.getElementById('exprLine');
  const resultEl = document.getElementById('resultLine');
  const statShift = document.getElementById('statShift');
  const statMode = document.getElementById('statMode');

  const state = {
    expr: '',          // raw expression with display tokens
    lastAns: 0,
    angleMode: 'DEG',  // DEG | RAD
    shift: false,
    alpha: false,
    hyp: false,
    sdMode: 'D',       // D = decimal, F = fraction-ish (toggle visual)
    justEvaluated: false,
  };

  // Mapping of display tokens (what user sees in expression) → JS code.
  // Done in two passes so implicit multiplication runs against the
  // user-level token soup, not the post-substitution Math.* identifiers
  // (otherwise "log10(" would get "0(" rewritten to "0*(", and trig
  // substitutions like "sin(" would re-match inside "Math.sin(" forever).
  function normalizeForEval(expr) {
    let s = expr;

    // Pass 1 — operators and constants only (token shape preserved)
    s = s.replace(/×10\^\(/g, '#TENPOW#');
    s = s.replace(/×/g, '*');
    s = s.replace(/÷/g, '/');
    s = s.replace(/−/g, '-');
    s = s.replace(/π/g, '#PI#');
    s = s.replace(/(?<![a-zA-Z#])e(?![a-zA-Z(#])/g, '#E#');
    s = s.replace(/Ans/g, '#ANS#');

    // Powers (note: ⁻¹ is handled AFTER func-token detection so that
    // "sin⁻¹(" is still intact when we look for inverse trig tokens)
    s = s.replace(/²/g, '**2');
    s = s.replace(/³/g, '**3');
    s = s.replace(/\^/g, '**');

    // Pass 2 — implicit multiplication using opaque function placeholders.
    // Replace each function-token "name(" with a unique sentinel "@F<i>@("
    // so "<digit><sentinel>(" can be detected as "needs *" without
    // mistakenly matching digits inside the future Math.* identifier.
    const funcTokens = [
      ['sin⁻¹(', 'asin', 'trig-inv'],
      ['cos⁻¹(', 'acos', 'trig-inv'],
      ['tan⁻¹(', 'atan', 'trig-inv'],
      ['sinh⁻¹(', 'asinh', 'hyp'],
      ['cosh⁻¹(', 'acosh', 'hyp'],
      ['tanh⁻¹(', 'atanh', 'hyp'],
      ['sinh(', 'sinh', 'hyp'],
      ['cosh(', 'cosh', 'hyp'],
      ['tanh(', 'tanh', 'hyp'],
      ['sin(', 'sin',  'trig'],
      ['cos(', 'cos',  'trig'],
      ['tan(', 'tan',  'trig'],
      ['log(', 'log10','plain'],
      ['ln(',  'log',  'plain'],
      ['√(',   'sqrt', 'plain'],
      ['∛(',   'cbrt', 'plain'],
    ];
    const placeholders = []; // [{sentinel, jsfn, kind}]
    funcTokens.forEach(([tok, jsfn, kind], i) => {
      if (s.includes(tok)) {
        const sentinel = `@F${i}@`;
        // Replace token "name(" with "<sentinel>("
        s = s.split(tok).join(sentinel + '(');
        placeholders.push({ sentinel, jsfn, kind });
      }
    });

    // Implicit multiplication on the placeholder-form string:
    //   digit/) followed by ( or by a sentinel or by #PI#/#E#/#ANS#/#TENPOW#
    s = s.replace(/(\d|\))(\s*)(\()/g, '$1*$3');
    s = s.replace(/(\d|\))(\s*)(@F\d+@)/g, '$1*$3');
    s = s.replace(/(\d|\))(\s*)(#PI#|#E#|#ANS#|#TENPOW#)/g, '$1*$3');
    // Also: constant followed by ( implies multiplication
    s = s.replace(/(#PI#|#E#|#ANS#)(\s*)(\()/g, '$1*$3');

    // Pass 3 — substitute placeholders with Math.* equivalents,
    // applying angle-mode wrapping for trig funcs by post-processing
    // the matching argument span.
    for (const { sentinel, jsfn, kind } of placeholders) {
      while (s.includes(sentinel + '(')) {
        const idx = s.indexOf(sentinel + '(');
        const openIdx = idx + sentinel.length;
        const closeIdx = findMatchingParen(s, openIdx);
        if (closeIdx === -1) break;
        const inner = s.slice(openIdx + 1, closeIdx);
        let replacement;
        if (kind === 'trig') {
          replacement = state.angleMode === 'DEG'
            ? `Math.${jsfn}((${inner})*Math.PI/180)`
            : `Math.${jsfn}(${inner})`;
        } else if (kind === 'trig-inv') {
          replacement = state.angleMode === 'DEG'
            ? `(Math.${jsfn}(${inner})*180/Math.PI)`
            : `Math.${jsfn}(${inner})`;
        } else {
          replacement = `Math.${jsfn}(${inner})`;
        }
        s = s.slice(0, idx) + replacement + s.slice(closeIdx + 1);
      }
    }

    // Pass 4 — final placeholder substitutions and remaining ⁻¹ → **(-1)
    s = s.replace(/⁻¹/g, '**(-1)');
    s = s.replace(/#PI#/g, '(Math.PI)');
    s = s.replace(/#E#/g, '(Math.E)');
    s = s.replace(/#ANS#/g, '(' + state.lastAns + ')');
    s = s.replace(/#TENPOW#/g, '*Math.pow(10,');

    return s;
  }

  function findMatchingParen(s, openIdx) {
    let depth = 0;
    for (let i = openIdx; i < s.length; i++) {
      if (s[i] === '(') depth++;
      else if (s[i] === ')') {
        depth--;
        if (depth === 0) return i;
      }
    }
    return -1;
  }

  function render() {
    exprEl.textContent = state.expr || '';
    statShift.textContent = state.angleMode === 'DEG' ? 'D'
      : state.angleMode === 'RAD' ? 'R' : 'G';
    if (state.shift) statShift.textContent = 'S ' + statShift.textContent;
    if (state.alpha) statShift.textContent = 'A ' + statShift.textContent;
    statMode.textContent = 'Math';
    // Auto-scroll expression to right
    exprEl.scrollLeft = exprEl.scrollWidth;
  }

  function setResult(value, isError=false) {
    resultEl.textContent = value;
    resultEl.classList.toggle('error', isError);
  }

  function append(token) {
    if (state.justEvaluated && /[0-9.πe(]/.test(token[0])) {
      state.expr = '';
    }
    state.justEvaluated = false;
    state.expr += token;
    render();
  }

  function backspace() {
    if (!state.expr) return;
    // Try to remove a multi-char token cleanly
    const multiTokens = ['sin⁻¹(', 'cos⁻¹(', 'tan⁻¹(', 'sinh(', 'cosh(', 'tanh(',
                          '×10^(', 'sin(', 'cos(', 'tan(', 'log(', 'ln(', '√(', '∛(', 'Ans'];
    for (const t of multiTokens) {
      if (state.expr.endsWith(t)) {
        state.expr = state.expr.slice(0, -t.length);
        render();
        return;
      }
    }
    state.expr = state.expr.slice(0, -1);
    render();
  }

  function clearAll() {
    state.expr = '';
    state.justEvaluated = false;
    setResult('');
    render();
  }

  function evaluate() {
    if (!state.expr.trim()) return;
    try {
      let normalized = normalizeForEval(state.expr);
      // Auto-close any unclosed parens
      const opens = (normalized.match(/\(/g) || []).length;
      const closes = (normalized.match(/\)/g) || []).length;
      normalized += ')'.repeat(Math.max(0, opens - closes));

      // Evaluate in a restricted scope
      // eslint-disable-next-line no-new-func
      const result = Function('"use strict"; return (' + normalized + ')')();

      if (typeof result !== 'number' || !isFinite(result)) {
        setResult('Math ERROR', true);
        return;
      }
      const formatted = formatNumber(result);
      setResult(formatted);
      state.lastAns = result;
      state.justEvaluated = true;
    } catch (e) {
      setResult('Syntax ERROR', true);
    }
  }

  function formatNumber(n) {
    if (state.sdMode === 'F') {
      const f = toFractionString(n);
      if (f) return f;
    }
    if (Math.abs(n) < 1e-10) return '0';
    const abs = Math.abs(n);
    if (abs >= 1e10 || (abs > 0 && abs < 1e-4)) {
      return n.toExponential(9).replace(/\.?0+e/, 'e');
    }
    // Up to 10 significant digits
    const str = parseFloat(n.toPrecision(10)).toString();
    return str;
  }

  function toFractionString(n) {
    if (!isFinite(n) || Number.isInteger(n)) return null;
    const sign = n < 0 ? -1 : 1;
    n = Math.abs(n);
    const whole = Math.floor(n);
    let frac = n - whole;
    if (frac < 1e-10) return null;
    // Stern–Brocot for best rational up to denominator 10000
    let lo_n = 0, lo_d = 1, hi_n = 1, hi_d = 1;
    let best_n = 1, best_d = 1, best_err = Infinity;
    for (let i = 0; i < 100; i++) {
      const m_n = lo_n + hi_n;
      const m_d = lo_d + hi_d;
      if (m_d > 10000) break;
      const v = m_n / m_d;
      const err = Math.abs(v - frac);
      if (err < best_err) { best_err = err; best_n = m_n; best_d = m_d; }
      if (err < 1e-10) break;
      if (v < frac) { lo_n = m_n; lo_d = m_d; }
      else { hi_n = m_n; hi_d = m_d; }
    }
    if (best_err > 1e-6) return null;
    const num = sign * (whole * best_d + best_n);
    return whole === 0
      ? `${sign === -1 ? '-' : ''}${best_n}/${best_d}`
      : `${sign === -1 ? '-' : ''}${whole}⌐${best_n}/${best_d}`;
  }

  // ---------- Key handler ----------
  function handleKey(key) {
    // Modifier keys
    if (key === 'SHIFT') { state.shift = !state.shift; state.alpha = false; updateShiftLabels(); render(); return; }
    if (key === 'ALPHA') { state.alpha = !state.alpha; state.shift = false; render(); return; }
    if (key === 'MODE') { state.angleMode = state.angleMode === 'DEG' ? 'RAD' : 'DEG'; render(); return; }
    if (key === 'ON') { clearAll(); state.lastAns = 0; return; }
    if (key === 'AC') {
      if (state.shift) { /* OFF */ clearAll(); state.shift = false; updateShiftLabels(); return; }
      clearAll(); return;
    }
    if (key === 'DEL') {
      if (state.shift) { /* INS — not implemented */ state.shift = false; updateShiftLabels(); return; }
      backspace(); return;
    }
    if (key === 'EQ') { evaluate(); state.shift = state.alpha = false; updateShiftLabels(); render(); return; }

    // Digits
    if (/^[0-9]$/.test(key)) {
      if (state.shift && key === '0') { /* Rnd */ append('Math.round('); state.shift = false; updateShiftLabels(); return; }
      append(key); state.shift = state.alpha = false; updateShiftLabels(); return;
    }
    if (key === 'DOT') {
      if (state.shift) { append('Math.random()'); state.shift = false; updateShiftLabels(); return; }
      append('.'); return;
    }

    // Operators
    const opMap = { PLUS: '+', MINUS: '−', MUL: '×', DIV: '÷' };
    if (opMap[key]) { append(opMap[key]); return; }

    if (key === 'NEG') { append('(-'); return; }
    if (key === 'LPAREN') { append('('); return; }
    if (key === 'RPAREN') { append(')'); return; }

    // Functions
    if (key === 'SIN') { append(state.shift ? 'sin⁻¹(' : 'sin('); state.shift = false; updateShiftLabels(); return; }
    if (key === 'COS') { append(state.shift ? 'cos⁻¹(' : 'cos('); state.shift = false; updateShiftLabels(); return; }
    if (key === 'TAN') { append(state.shift ? 'tan⁻¹(' : 'tan('); state.shift = false; updateShiftLabels(); return; }
    if (key === 'LOG') { append(state.shift ? '10^(' : 'log('); state.shift = false; updateShiftLabels(); return; }
    if (key === 'LN')  { append(state.shift ? 'e^(' : 'ln('); state.shift = false; updateShiftLabels(); return; }
    if (key === 'SQRT') { append(state.shift ? '%' : '√('); state.shift = false; updateShiftLabels(); return; }
    if (key === 'SQUARE') { append(state.shift ? '∛(' : '²'); state.shift = false; updateShiftLabels(); return; }
    if (key === 'POW') { append('^('); return; }
    if (key === 'INV') { append('⁻¹'); return; }
    if (key === 'EXP') {
      if (state.shift) { append('π'); state.shift = false; updateShiftLabels(); return; }
      append('×10^('); return;
    }
    if (key === 'ANS') {
      if (state.shift) { state.angleMode = state.angleMode === 'DEG' ? 'RAD' : 'DEG'; state.shift = false; updateShiftLabels(); render(); return; }
      append('Ans'); return;
    }
    if (key === 'SD') { state.sdMode = state.sdMode === 'D' ? 'F' : 'D'; if (state.lastAns) setResult(formatNumber(state.lastAns)); return; }
    if (key === 'HYP') { /* no-op visual */ state.hyp = !state.hyp; return; }
    if (key === 'FRAC') { append('/'); return; }
    if (key === 'LOGAB') { append('log('); return; }
    if (key === 'ENG') { /* no-op */ return; }
    if (key === 'RCL') { /* memory recall — not implemented */ return; }
    if (key === 'MPLUS') { /* memory add — not implemented */ return; }
    if (key === 'CALC') { evaluate(); return; }

    // Cursor keys — ignore for now
    if (['UP', 'DOWN', 'LEFT', 'RIGHT'].includes(key)) return;
  }

  function updateShiftLabels() {
    document.querySelectorAll('.shift-key').forEach(el => {
      el.classList.toggle('shift-active', state.shift);
    });
  }

  // ---------- Wire up button clicks ----------
  document.querySelectorAll('[data-key]').forEach(btn => {
    btn.addEventListener('click', () => handleKey(btn.dataset.key));
  });

  // ---------- Keyboard ----------
  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if (/^[0-9]$/.test(k)) { handleKey(k); return; }
    const map = {
      '+': 'PLUS', '-': 'MINUS', '*': 'MUL', '/': 'DIV',
      '(': 'LPAREN', ')': 'RPAREN', '.': 'DOT',
      'Enter': 'EQ', '=': 'EQ',
      'Backspace': 'DEL', 'Escape': 'AC',
      's': 'SHIFT', 'S': 'SHIFT',
      'a': 'ALPHA', 'A': 'ALPHA',
      '^': 'POW',
    };
    if (map[k]) { e.preventDefault(); handleKey(map[k]); return; }
    if (k === 'p' || k === 'P') { append('π'); return; }
    if (k === 'r' || k === 'R') { append('√('); return; }
  });

  // Initial render
  render();
  setResult('0');
})();

</script>
</body>
</html>
